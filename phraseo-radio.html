<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2B2F33">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Phraséo">
  <meta name="description" content="Entraînement à la phraséologie radio VFR (ATIS, AFIS, auto-information) selon le manuel DSNA.">
  <title>Phraséo Radio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=B612:wght@400;700&family=B612+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
/* Phraséo Radio — façade de radio VHF en haut, planchette de genou (kneeboard) en dessous.
   Typo : B612 / B612 Mono, polices conçues pour les écrans de cockpit. */

:root {
  --panel: #2B2F33;
  --panel-edge: #1C1F22;
  --bezel: #3B4046;
  --lcd-bg: #1A1408;
  --lcd: #F2A23A;
  --lcd-dim: #6E4F22;
  --paper: #ECEAE4;
  --paper-line: #C9D3DD;
  --margin-line: #D9A3A0;
  --ink: #1F2A3A;
  --ink-soft: #586273;
  --red: #B8322A;
  --ok: #2E7448;
  --warn: #9A6A12;
  --font: 'B612', 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
  --mono: 'B612 Mono', 'SF Mono', Menlo, Consolas, monospace;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--panel);
  color: var(--ink);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button { font-family: inherit; font-size: inherit; color: inherit; cursor: pointer; }
button:focus-visible, textarea:focus-visible, input:focus-visible, select:focus-visible {
  outline: 2px solid var(--lcd); outline-offset: 2px;
}

.app { display: flex; flex-direction: column; min-height: 100%; max-width: 640px; margin: 0 auto; }

/* ── Façade radio ─────────────────────────────────────────────── */
.radio {
  position: sticky; top: 0; z-index: 10;
  padding: calc(var(--safe-t) + 10px) 12px 12px;
  background:
    radial-gradient(circle at 8px 8px, #4a5057 1.5px, transparent 2px) 0 0 / 100% 100% no-repeat,
    linear-gradient(#33383d, var(--panel));
  border-bottom: 3px solid var(--panel-edge);
}
.radio-top { display: grid; grid-template-columns: 44px 1fr auto; gap: 10px; align-items: center; }
.knob {
  width: 44px; height: 44px; border-radius: 50%; border: 0; padding: 0;
  background: conic-gradient(from 20deg, #555b62, #2a2e33, #555b62, #2a2e33, #555b62);
  box-shadow: 0 2px 0 var(--panel-edge), inset 0 0 0 2px #1e2124;
}
.knob-face { display: block; width: 22px; height: 22px; margin: 11px; border-radius: 50%; background: #23272b; position: relative; }
.knob-face::after { content: ''; position: absolute; left: 10px; top: 2px; width: 2px; height: 8px; background: var(--lcd); }
.lcd {
  background: var(--lcd-bg);
  border: 2px solid var(--bezel);
  border-radius: 4px;
  padding: 6px 10px;
  font-family: var(--mono);
  color: var(--lcd);
  text-shadow: 0 0 6px rgba(242, 162, 58, .35);
  min-width: 0;
}
.lcd-row { display: flex; gap: 12px; align-items: baseline; white-space: nowrap; overflow: hidden; }
.lcd-main { font-size: 15px; font-weight: 700; justify-content: space-between; }
.lcd-main span:first-child { overflow: hidden; text-overflow: ellipsis; }
.lcd-sub { font-size: 13px; color: var(--lcd); opacity: .85; }
.lcd-sub span:empty { display: none; }
.lamp { flex: none; width: 9px; height: 9px; border-radius: 50%; background: var(--lcd-dim); }
.lamp.rx { background: #64d27c; box-shadow: 0 0 8px #64d27c; }
.lamp.tx { background: #ff5a4a; box-shadow: 0 0 8px #ff5a4a; }
.radio-buttons { display: flex; flex-direction: column; gap: 6px; }
.hw {
  font-family: var(--mono); font-size: 11px; letter-spacing: .04em;
  background: #23272b; color: #c9ccd0; border: 1px solid #4a5057; border-radius: 3px;
  padding: 4px 8px; box-shadow: 0 2px 0 var(--panel-edge);
}
.hw:active { transform: translateY(1px); box-shadow: none; }

/* ── Planchette ───────────────────────────────────────────────── */
main {
  flex: 1;
  background:
    linear-gradient(90deg, transparent 30px, var(--margin-line) 30px, var(--margin-line) 31px, transparent 31px),
    repeating-linear-gradient(var(--paper) 0 27px, var(--paper-line) 27px 28px);
  background-color: var(--paper);
  padding: 18px 16px calc(24px + var(--safe-b)) 42px;
  border-radius: 10px 10px 0 0;
  margin-top: -2px;
  box-shadow: 0 -2px 0 #b9b6ae inset;
}

h1, h2, h3 { font-weight: 700; line-height: 1.2; margin: 0; }
h2 { font-size: 22px; margin-bottom: 4px; }
h3 { font-size: 16px; margin: 22px 0 8px; color: var(--ink-soft); }
p { margin: 0 0 10px; max-width: 70ch; }

/* Accueil */
.setup { display: grid; gap: 10px; margin-bottom: 14px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; border: 1.5px solid var(--ink); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 10px 6px; font-weight: 700; }
.seg button + button { border-left: 1.5px solid var(--ink); }
.seg button[aria-checked="true"] { background: var(--ink); color: var(--paper); }
.mode-help { font-size: 14px; color: var(--ink-soft); }

.notice {
  border-left: 3px solid var(--red); background: rgba(184, 50, 42, .06);
  padding: 8px 12px; margin-bottom: 12px; font-size: 14px;
}
.notice button { background: none; border: 0; padding: 0; color: var(--red); font-weight: 700; text-decoration: underline; }

.scn {
  display: block; width: 100%; text-align: left;
  background: rgba(255, 255, 255, .55); border: 1px solid #c4c2bb; border-radius: 6px;
  padding: 12px 14px; margin-bottom: 8px;
}
.scn:active { background: rgba(255, 255, 255, .9); }
.scn strong { display: block; font-size: 16px; }
.scn span { display: block; font-size: 14px; color: var(--ink-soft); }
.scn .last { font-family: var(--mono); font-size: 12px; margin-top: 4px; color: var(--ink-soft); }
.disclaimer { font-size: 12px; color: var(--ink-soft); margin-top: 22px; }

/* Session : journal des échanges */
.session-head { margin-bottom: 14px; }
.session-head p { color: var(--ink-soft); font-size: 14px; margin: 2px 0 0; }
.log { display: grid; gap: 12px; padding-bottom: 8px; }
.msg { font-family: var(--mono); font-size: 15px; line-height: 1.5; }
.msg .who { display: block; font-family: var(--font); font-size: 12px; color: var(--ink-soft); }
.msg.station { padding-left: 10px; border-left: 3px solid var(--ink); }
.msg.other { padding-left: 10px; border-left: 3px dashed var(--ink-soft); color: var(--ink-soft); }
.msg.pilot { padding-left: 10px; border-left: 3px solid var(--lcd-dim); }
.msg .hidden-text { color: var(--ink-soft); font-family: var(--font); font-size: 14px; }
.msg .reveal { background: none; border: 0; padding: 0; color: var(--ink); text-decoration: underline; font-family: var(--font); font-size: 14px; }
.atis-text { white-space: pre-line; }

.sit {
  background: rgba(255, 255, 255, .7); border: 1.5px solid var(--ink); border-radius: 6px;
  padding: 10px 12px; font-size: 15px;
}
.sit .src { display: block; font-size: 12px; color: var(--ink-soft); margin-top: 4px; }
.hint { margin-top: 8px; font-family: var(--mono); font-size: 14px; color: var(--ink-soft); }
.hint[hidden] { display: none; }
.link { background: none; border: 0; padding: 0; color: var(--ink); text-decoration: underline; font-size: 14px; }

/* Correction au stylo rouge */
.eval { border-radius: 6px; padding: 10px 12px; background: rgba(255, 255, 255, .75); border: 1px solid #c4c2bb; }
.eval-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.verdict { font-weight: 700; }
.verdict.correct { color: var(--ok); }
.verdict.acceptable { color: var(--warn); }
.verdict.incorrect { color: var(--red); }
.score { font-family: var(--mono); font-weight: 700; font-size: 18px; }
.rb { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.rb span { font-family: var(--mono); font-size: 12px; padding: 2px 7px; border-radius: 3px; border: 1px solid currentColor; }
.rb .ok { color: var(--ok); }
.rb .ko { color: var(--red); }
.err { margin: 8px 0 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.err li { font-size: 14px; border-left: 2px solid var(--red); padding-left: 8px; }
.err li.mineure { border-left-color: var(--warn); }
.err li.conseil { border-left-color: var(--ink-soft); }
.err s { color: var(--red); text-decoration-thickness: 2px; font-family: var(--mono); }
.err ins { text-decoration: none; color: var(--ok); font-family: var(--mono); font-weight: 700; }
.err small { display: block; color: var(--ink-soft); }
.fixed { font-family: var(--mono); font-size: 14px; margin-top: 10px; color: var(--ok); }
.comment { font-size: 14px; color: var(--ink-soft); margin-top: 8px; }
.local-tag { font-size: 12px; color: var(--warn); }

/* Dock de transmission */
.dock {
  position: sticky; bottom: 0; margin: 12px -16px calc(-24px - var(--safe-b)) -42px;
  padding: 12px 16px calc(14px + var(--safe-b));
  background: var(--panel); color: #e8e6e1;
  border-top: 3px solid var(--panel-edge);
  display: grid; gap: 10px;
}
.dock textarea {
  width: 100%; min-height: 64px; resize: vertical;
  font-family: var(--mono); font-size: 15px;
  background: var(--lcd-bg); color: var(--lcd); border: 2px solid var(--bezel); border-radius: 4px; padding: 8px;
}
.dock textarea::placeholder { color: var(--lcd-dim); }
.dock-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; }
.ptt {
  height: 64px; border-radius: 8px; border: 0;
  background: linear-gradient(#3b4046, #2a2e33);
  box-shadow: 0 4px 0 var(--panel-edge), inset 0 0 0 2px #4d535a;
  color: #e8e6e1; font-weight: 700; font-size: 17px;
  touch-action: none; user-select: none; -webkit-user-select: none;
}
.ptt.on { background: #7a1f19; box-shadow: 0 1px 0 var(--panel-edge), inset 0 0 0 2px #ff5a4a; transform: translateY(3px); }
.ptt:disabled { opacity: .5; }
.btn {
  border-radius: 6px; padding: 12px 16px; font-weight: 700; border: 1.5px solid var(--ink);
  background: transparent;
}
.btn.primary { background: var(--ink); color: var(--paper); }
.dock .btn { border-color: var(--lcd); color: var(--lcd); }
.dock .btn.primary { background: var(--lcd); color: var(--lcd-bg); }
.btn:disabled { opacity: .45; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.dock-note { font-size: 12px; color: #a9adb2; margin: 0; }

/* Quiz ATIS */
.quiz { display: grid; gap: 10px; }
.quiz label { display: grid; grid-template-columns: 120px 1fr auto; gap: 8px; align-items: center; font-size: 14px; }
.quiz input { font-family: var(--mono); font-size: 16px; padding: 8px; border: 1.5px solid var(--ink); border-radius: 4px; background: #fff; min-width: 0; }
.quiz .res { font-family: var(--mono); font-size: 13px; }
.quiz .res.ok { color: var(--ok); }
.quiz .res.ko { color: var(--red); }

/* Réglages & historique */
.form { display: grid; gap: 14px; }
.field { display: grid; gap: 4px; }
.field > span { font-size: 14px; font-weight: 700; }
.field small { color: var(--ink-soft); font-size: 13px; }
.field input, .field select {
  font-family: var(--mono); font-size: 16px; padding: 10px; border: 1.5px solid var(--ink); border-radius: 4px; background: #fff; width: 100%;
}
.pair { display: grid; grid-template-columns: 1.3fr 1fr; gap: 8px; }
.usage { font-family: var(--mono); font-size: 13px; }

.hist-item { border-bottom: 1px solid #c4c2bb; padding: 10px 0; }
.hist-item summary { list-style: none; display: grid; grid-template-columns: 1fr auto; gap: 8px; cursor: pointer; }
.hist-item summary::-webkit-details-marker { display: none; }
.hist-item .meta { font-size: 13px; color: var(--ink-soft); }
.hist-item .score { font-size: 16px; }
.recurring { margin: 0 0 6px; padding-left: 18px; }
.recurring li { font-size: 14px; margin-bottom: 4px; }
.bar { display: grid; grid-template-columns: 130px 1fr 32px; gap: 8px; align-items: center; font-size: 13px; margin-bottom: 4px; }
.bar i { display: block; height: 8px; background: var(--red); border-radius: 2px; }
.empty { color: var(--ink-soft); }

.spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--ink-soft); border-top-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px; margin-right: 6px; }
@keyframes spin { to { transform: rotate(360deg); } }

@media (prefers-reduced-motion: reduce) {
  .spinner { animation-duration: 2.4s; }
  .ptt.on { transform: none; }
}
@media (min-width: 640px) {
  main { border-radius: 10px; margin-bottom: 20px; }
}

</style>
</head>
<body>
  <div class="app">
    <!-- Façade radio : toujours visible -->
    <header class="radio" id="radio">
      <div class="radio-top">
        <button class="knob" id="btn-home" aria-label="Retour aux exercices">
          <span class="knob-face"></span>
        </button>
        <div class="lcd" id="lcd" aria-live="polite">
          <div class="lcd-row lcd-main">
            <span id="lcd-station">PHRASÉO RADIO</span>
            <span class="lamp" id="lamp" aria-hidden="true"></span>
          </div>
          <div class="lcd-row lcd-sub">
            <span id="lcd-freq">— — —</span>
            <span id="lcd-info"></span>
            <span id="lcd-qnh"></span>
          </div>
        </div>
        <div class="radio-buttons">
          <button class="hw" id="btn-history" aria-label="Historique">HIST</button>
          <button class="hw" id="btn-settings" aria-label="Réglages">SET</button>
        </div>
      </div>
    </header>

    <main id="screen"></main>
  </div>

  <template id="tpl-home">
    <section class="home">
      <div class="setup">
        <div class="seg" role="radiogroup" aria-label="Langue">
          <button data-lang="fr" role="radio">Français</button>
          <button data-lang="en" role="radio">English</button>
        </div>
        <div class="seg" role="radiogroup" aria-label="Mode">
          <button data-mode="debutant" role="radio">Débutant</button>
          <button data-mode="experimente" role="radio">Expérimenté</button>
        </div>
        <p class="mode-help" id="mode-help"></p>
        <p class="mode-help" id="engine-line"></p>
      </div>
      <div id="notices"></div>
      <div id="scenario-list"></div>
      <p class="disclaimer">Pistes et fréquences des aérodromes sont indicatives : la référence reste la carte VAC du SIA. Phraséologie basée sur le Manuel DSNA, 10e édition (avril 2023).</p>
    </section>
  </template>

  <script type="module">
// ===== aerodromes.js =====
// Données d'aérodromes de Nouvelle-Aquitaine utilisées pour générer les exercices.
// ⚠️ INDICATIVES : pistes et fréquences sont à vérifier et corriger sur les cartes VAC
// du SIA (https://www.sia.aviation-civile.gouv.fr) avant de s'y fier. Modifie librement ce fichier.
//
// kind : 'afis' (AFIS ouvert), 'twr' (tour de contrôle), 'auto' (auto-information)
// rwys : les deux QFU de la piste principale, sous forme "11" / "29"

const AERODROMES = [
  // Aérodromes AFIS
  { oaci: 'LFBX', name: 'Périgueux', full: 'Périgueux-Bassillac', kind: 'afis', rwys: ['11', '29'], freq: '119.255' },
  { oaci: 'LFCH', name: 'Arcachon', full: 'Arcachon-La Teste-de-Buch', kind: 'afis', rwys: ['10', '28'], freq: '118.375' },
  { oaci: 'LFBU', name: 'Angoulême', full: 'Angoulême-Brie-Champniers', kind: 'afis', rwys: ['10', '28'], freq: '118.350' },
  { oaci: 'LFBN', name: 'Niort', full: 'Niort-Souché', kind: 'afis', rwys: ['07', '25'], freq: '118.200' },
  { oaci: 'LFCY', name: 'Royan', full: 'Royan-Médis', kind: 'afis', rwys: ['10', '28'], freq: '118.550' },
  { oaci: 'LFSL', name: 'Brive', full: 'Brive-Souillac', kind: 'afis', rwys: ['11', '29'], freq: '119.400' },

  // Aérodromes contrôlés
  { oaci: 'LFBE', name: 'Bergerac', full: 'Bergerac-Dordogne-Périgord', kind: 'twr', rwys: ['10', '28'], freq: '120.150' },
  { oaci: 'LFBH', name: 'La Rochelle', full: 'La Rochelle-Île de Ré', kind: 'twr', rwys: ['09', '27'], freq: '118.200' },
  { oaci: 'LFBA', name: 'Agen', full: 'Agen-La Garenne', kind: 'twr', rwys: ['11', '29'], freq: '118.100' },

  // Aérodromes en auto-information
  { oaci: 'LFCD', name: 'Andernos', full: 'Andernos-les-Bains', kind: 'auto', rwys: ['08', '26'], freq: '123.500' },
  { oaci: 'LFDK', name: 'Soulac', full: 'Soulac-sur-Mer', kind: 'auto', rwys: ['10', '28'], freq: '123.500' },
  { oaci: 'LFDI', name: 'Libourne', full: 'Libourne-Artigues-de-Lussac', kind: 'auto', rwys: ['09', '27'], freq: '123.500' },
  { oaci: 'LFCS', name: 'Léognan', full: 'Bordeaux-Léognan-Saucats', kind: 'auto', rwys: ['06', '24'], freq: '123.500' },
];

// ===== radio.js =====
// Génération du contexte d'un exercice et mise en forme radio (affichage + énonciation vocale).
// Règles d'énonciation tirées du Manuel de phraséologie DSNA (10e éd., avril 2023), chapitre 2.E.


const PHON = {
  A: 'Alfa', B: 'Bravo', C: 'Charlie', D: 'Delta', E: 'Echo', F: 'Fox', G: 'Golf', H: 'Hotel',
  I: 'India', J: 'Juliett', K: 'Kilo', L: 'Lima', M: 'Mike', N: 'November', O: 'Oscar', P: 'Papa',
  Q: 'Québec', R: 'Roméo', S: 'Sierra', T: 'Tango', U: 'Uniform', V: 'Victor', W: 'Whiskey',
  X: 'X-ray', Y: 'Yankee', Z: 'Zulu',
};
const EN_DIGITS = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'niner'];
const FR_DIGITS = ['zéro', 'un', 'deux', 'trois', 'quatre', 'cinq', 'six', 'sept', 'huit', 'neuf'];

const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const pad = (n, l = 2) => String(n).padStart(l, '0');

const digitsEN = (s) => String(s).split('').map((c) => (/\d/.test(c) ? EN_DIGITS[+c] : c)).join(' ');
const digitsFR = (s) => String(s).split('').map((c) => (/\d/.test(c) ? FR_DIGITS[+c] : c)).join(' ');
const spellPhon = (s) => String(s).toUpperCase().replace(/[^A-Z0-9]/g, '').split('')
  .map((c) => PHON[c] || EN_DIGITS[+c]).join(' ');

// Indicatif abrégé (type a) : premier caractère + deux derniers (GM1 SERA.14050)
function abbreviate(reg) {
  const clean = reg.toUpperCase().replace(/[^A-Z0-9]/g, '');
  return `${clean[0]}-${clean.slice(-2)}`;
}

// Altitude en anglais : milliers "thousand", centaines "hundred"
function altEN(n) {
  const th = Math.floor(n / 1000), hu = Math.floor((n % 1000) / 100);
  let s = '';
  if (th) s += `${digitsEN(th)} thousand`;
  if (hu) s += `${s ? ' ' : ''}${digitsEN(hu)} hundred`;
  return s || digitsEN(n);
}
const fmtThousands = (n) => (n >= 1000 ? `${Math.floor(n / 1000)} ${pad(n % 1000, 3)}` : String(n));

// QNH anglais : 1000 → "one thousand", sinon chiffre par chiffre
const qnhEN = (q) => (q % 1000 === 0 ? `${digitsEN(q / 1000)} thousand` : digitsEN(q));

// Fréquence : 5e et 6e chiffres non énoncés s'ils valent zéro
function freqSpokenEN(f) {
  let [a, b] = f.split('.');
  b = b.replace(/0+$/, '') || '0';
  return `${digitsEN(a)} decimal ${digitsEN(b)}`;
}
function freqSpokenFR(f) {
  let [a, b] = f.split('.');
  b = b.replace(/0+$/, '') || '0';
  return `${a} décimale ${b}`;
}

const DIRS = [
  { fr: 'au nord', en: 'north', deg: 0 }, { fr: 'au nord-est', en: 'north-east', deg: 45 },
  { fr: "à l'est", en: 'east', deg: 90 }, { fr: 'au sud-est', en: 'south-east', deg: 135 },
  { fr: 'au sud', en: 'south', deg: 180 }, { fr: 'au sud-ouest', en: 'south-west', deg: 225 },
  { fr: "à l'ouest", en: 'west', deg: 270 }, { fr: 'au nord-ouest', en: 'north-west', deg: 315 },
];

const TRAFFIC = [
  { d: 'DR400', fr: 'D R quatre cents', en: 'D R four hundred' },
  { d: 'Cessna 172', fr: 'Cessna cent soixante-douze', en: 'Cessna one seven two' },
  { d: 'PA28', fr: 'P A vingt-huit', en: 'P A two eight' },
  { d: 'Robin DR500', fr: 'Robin D R cinq cents', en: 'Robin D R five hundred' },

const REMARKS = [
  null, null,
  { fr: 'Activité parachutage en cours, verticale terrain, jusqu\'au niveau 120', en: 'Parachute activity in progress overhead the aerodrome up to level 120' },
  { fr: 'PAPI piste {rwy} en panne', en: 'PAPI runway {rwy} unserviceable' },

const CLOUDS = [
  { cavok: true },
  { fr: 'peu', en: 'few', h: [1500, 2000, 2500, 3000, 3500] },
  { fr: 'épars', en: 'scattered', h: [2000, 2500, 3000, 4000] },
  { fr: 'fragmentés', en: 'broken', h: [3000, 3500, 4500] },
];

// Valeur à double forme : affichée (d) et énoncée (s), éventuellement par langue
const v = (d, s = d) => ({ d, s });
const vl = (fr, en) => ({ fr, en });

function pickRunway(ad, windDir) {
  // Choisit le QFU le plus face au vent
  let best = ad.rwys[0], bestDiff = 999;
  for (const r of ad.rwys) {
    const diff = Math.abs(((+r * 10 - windDir + 540) % 360) - 180);
    if (diff < bestDiff) { bestDiff = diff; best = r; }
  }
  return best;
}

function aircraftList(settings) {
  return (settings.aircraft || []).filter((a) => a.reg && a.reg.replace(/[^A-Z0-9]/gi, '').length >= 4);
}

function buildContext(scn, settings) {
  const pool = AERODROMES.filter((a) => a.kind === scn.adKind);
  const preferred = settings.homeAd && pool.find((a) => a.oaci === settings.homeAd);
  const ad = scn.allowHome && preferred && Math.random() < 0.4 ? preferred : pick(pool);
  const others = AERODROMES.filter((a) => a.oaci !== ad.oaci);
  const from = pick(others);
  const to = pick(others.filter((a) => a.oaci !== from.oaci));

  const acList = aircraftList(settings);
  const ac = acList.length ? pick(acList) : { reg: 'F-GABC', type: 'DR400' };
  const reg = ac.reg.toUpperCase().replace(/\s/g, '');
  const regClean = reg.replace(/[^A-Z0-9]/g, '');
  const regDisp = regClean.length > 1 ? `${regClean[0]}-${regClean.slice(1)}` : reg;
  const abbr = abbreviate(reg);

  const windDir = rnd(0, 35) * 10 || 360;
  const windSpd = rnd(3, 14);
  const gust = Math.random() < 0.15 ? windSpd + rnd(8, 12) : null;
  const rwy = pickRunway(ad, windDir);
  const qnh = rnd(1004, 1029);
  const atis = String.fromCharCode(65 + rnd(0, 25));
  const now = new Date();
  const recMin = Math.max(0, now.getUTCMinutes() - rnd(5, 25));
  const recTime = `${pad(now.getUTCHours())}${pad(Math.floor(recMin / 10) * 10)}`;
  const temp = rnd(4, 27);
  const dew = temp - rnd(1, 9);
  const cloud = pick(CLOUDS);
  const cloudH = cloud.cavok ? null : pick(cloud.h);
  const vis = cloud.cavok ? null : pick([10, 10, 9, 8, 7]);
  const side = Math.random() < 0.7 ? 'gauche' : 'droite';
  const dir = pick(DIRS);
  const dist = rnd(8, 15);
  const alt = pick([1500, 2000, 2500, 3000]);
  const etaMin = (now.getUTCMinutes() + rnd(6, 12)) % 60;
  const pob = rnd(1, 3);
  const hdg = (dir.deg + 180) % 360; // vers le terrain
  const traffic = pick(TRAFFIC);
  const remark = pick(REMARKS);
  const exitDir = pick(DIRS);

  const windFR = `${pad(windDir, 3)} degrés, ${windSpd} nœuds${gust ? `, rafales ${gust} nœuds` : ''}`;
  const windFRs = `${digitsFR(pad(windDir, 3))} degrés, ${windSpd} nœuds${gust ? `, rafales ${gust} nœuds` : ''}`;
  const windEN = `${pad(windDir, 3)} degrees, ${windSpd} knots${gust ? ` gusting ${gust} knots` : ''}`;
  const windENs = `${digitsEN(pad(windDir, 3))} degrees, ${digitsEN(windSpd)} knots${gust ? ` gusting ${digitsEN(gust)} knots` : ''}`;

  const stName = {
    afis: vl(v(`${ad.name} Information`), v(`${ad.name} Information`)),
    twr: vl(v(`${ad.name} Tour`), v(`${ad.name} Tower`)),
    auto: vl(v(ad.name), v(`${ad.name} traffic`)),
  }[ad.kind];

  const vars = {
    cs: v(regDisp, spellPhon(regClean)),
    csA: v(abbr, spellPhon(abbr)),
    type: v(ac.type || 'DR400'),
    st: stName,
    ad: v(ad.name),
    from: v(from.name),
    to: v(to.name),
    rwy: vl(v(rwy, rwy.startsWith('0') ? digitsFR(rwy) : rwy), v(rwy, digitsEN(rwy))),
    qnh: vl(v(String(qnh), String(qnh)), v(String(qnh), qnhEN(qnh))),
    atis: v(atis, PHON[atis]),
    wind: vl(v(windFR, windFRs), v(windEN, windENs)),
    side: vl(v(side), v(side === 'gauche' ? 'left-hand' : 'right-hand')),
    pos: vl(v(`${dist} NM ${dir.fr} de ${ad.name}`, `${dist} nautiques ${dir.fr} de ${ad.name}`),
      v(`${dist} NM ${dir.en} of ${ad.name}`, `${digitsEN(dist)} miles ${dir.en} of ${ad.name}`)),
    alt: vl(v(`${fmtThousands(alt)} pieds`), v(`${fmtThousands(alt)} feet`, `${altEN(alt)} feet`)),
    altT: vl(v(`${fmtThousands(alt + 500)} pieds`), v(`${fmtThousands(alt + 500)} feet`, `${altEN(alt + 500)} feet`)),
    eta: vl(v(pad(etaMin)), v(pad(etaMin), digitsEN(pad(etaMin)))),
    pob: vl(v(`${pob} personne${pob > 1 ? 's' : ''} à bord`), v(`${pob} person${pob > 1 ? 's' : ''} on board`)),
    hdg: vl(v(pad(hdg || 360, 3), digitsFR(pad(hdg || 360, 3))), v(pad(hdg || 360, 3), digitsEN(pad(hdg || 360, 3)))),
    traf: vl(v(traffic.d, traffic.fr), v(traffic.d, traffic.en)),
    freq: vl(v(ad.freq.replace('.', ','), freqSpokenFR(ad.freq)), v(ad.freq, freqSpokenEN(ad.freq))),
    exit: vl(v(exitDir.fr.replace(/^(au |à l')/, (m) => (m === 'au ' ? 'le ' : "l'"))), v(exitDir.en)),
  };

  const ctx = {
    ad, from, to, reg: regDisp, abbr, acType: ac.type, rwy, qnh, atis, windDir, windSpd, gust, temp, dew,
    side, recTime, cloud, cloudH, vis, remark, vars,
    // Valeurs clés exposées pour le contrôle des collationnements
    keys: { rwy, qnh: String(qnh), atis, side, csA: abbr, cs: regDisp, freq: ad.freq },
  };
  ctx.atisText = { fr: buildAtis(ctx, 'fr'), en: buildAtis(ctx, 'en') };
  return ctx;
}

// Remplace {clé} par la forme affichée (d) ou énoncée (s) dans la langue demandée
function render(tpl, ctx, lang, form = 'd') {
  const out = tpl.replace(/\{(\w+)\}/g, (m, k) => {
    const val = ctx.vars[k];
    if (!val) return m;
    const byLang = val.fr || val.en ? val[lang] || val.fr : val;
    return byLang[form];
  });
  // Élision française : « de Arcachon » → « d'Arcachon »
  let res = lang === 'fr' ? out.replace(/\bde (?=[AEIOUYÂÉÈÊÎÔ])/g, "d'") : out;
  // Sigles épelés pour la synthèse vocale (manuel, chap. 2.D)
  if (form === 's') res = res.replace(/\bQNH\b/g, 'Q N H').replace(/\bVFR\b/g, 'V F R').replace(/\bPAPI\b/g, 'Papi');
  return res;
}

function buildAtis(ctx, lang) {
  const { ad, atis, recTime, rwy, temp, dew, qnh, cloud, cloudH, vis, remark } = ctx;
  const lines = [];
  if (lang === 'fr') {
    lines.push(v(`Bonjour, ici ${ad.name}, information ${atis}`, `Bonjour, ici ${ad.name}, information ${PHON[atis]}`));
    lines.push(v(`Enregistrée à ${recTime} UTC`, `Enregistrée à ${digitsFR(recTime)} U T C`));
    lines.push(v(`Piste en service ${rwy}`, `Piste en service ${rwy.startsWith('0') ? digitsFR(rwy) : rwy}`));
    if (remark) lines.push(v(remark.fr.replace('{rwy}', rwy)));
    lines.push(v(`Vent ${ctx.vars.wind.fr.d}`, `Vent ${ctx.vars.wind.fr.s}`));
    if (cloud.cavok) lines.push(v('CAVOK', 'Cav O K'));
    else {
      lines.push(v(`Visibilité ${vis === 10 ? '10 kilomètres ou plus' : `${vis} kilomètres`}`));
      lines.push(v(`Nuages ${cloud.fr} ${fmtThousands(cloudH)} pieds`));
    }
    lines.push(v(`Température ${temp}, point de rosée ${dew}`, `Température ${temp < 0 ? 'moins ' + -temp : temp}, point de rosée ${dew < 0 ? 'moins ' + -dew : dew}`));
    lines.push(v(`QNH ${qnh}`, `Q N H ${qnh}`));
    lines.push(v(`Informez ${ad.name} dès le premier contact que vous avez reçu l'information ${atis}`,
      `Informez ${ad.name} dès le premier contact que vous avez reçu l'information ${PHON[atis]}`));
  } else {
    lines.push(v(`Good morning, this is ${ad.name} information ${atis}`, `Good morning, this is ${ad.name} information ${PHON[atis]}`));
    lines.push(v(`Recorded at ${recTime} UTC`, `Recorded at ${digitsEN(recTime)} U T C`));
    lines.push(v(`Runway in use ${rwy}`, `Runway in use ${digitsEN(rwy)}`));
    if (remark) lines.push(v(remark.en.replace('{rwy}', rwy), remark.en.replace('{rwy}', digitsEN(rwy))));
    lines.push(v(`Wind ${ctx.vars.wind.en.d}`, `Wind ${ctx.vars.wind.en.s}`));
    if (cloud.cavok) lines.push(v('CAVOK', 'Cav O K'));
    else {
      lines.push(v(`Visibility ${vis === 10 ? '10 kilometres or more' : `${vis} kilometres`}`,
        `Visibility ${vis === 10 ? 'one zero kilometres or more' : `${digitsEN(vis)} kilometres`}`));
      lines.push(v(`Clouds ${cloud.en} ${fmtThousands(cloudH)} feet`, `Clouds ${cloud.en} ${altEN(cloudH)} feet`));
    }
    const tEN = (t) => (t < 0 ? `minus ${digitsEN(-t)}` : digitsEN(t));
    lines.push(v(`Temperature ${temp}, dew point ${pad(dew)}`, `Temperature ${tEN(temp)}, dew point ${tEN(dew)}`));
    lines.push(v(`QNH ${qnh}`, `Q N H ${qnhEN(qnh)}`));
    lines.push(v(`Inform ${ad.name} on initial contact you have received information ${atis}`,
      `Inform ${ad.name} on initial contact you have received information ${PHON[atis]}`));
  }
  return { d: lines.map((l) => l.d).join('.\n') + '.', s: lines.map((l) => l.s).join('. ') + '.' };
}

function read(key, fallback) {
  try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; } catch { return fallback; }
}
function write(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); return true; } catch { return false; }
}

function loadSettings() {
  const { apiKey, model, usage, ...s } = read(SETTINGS_KEY, {}); // anciens champs API supprimés
  return { ...DEFAULTS, ...s };
}
function saveSettings(s) { write(SETTINGS_KEY, s); }

function loadHistory() { return read(HISTORY_KEY, []); }
function addSession(session) {
  const h = loadHistory();
  h.unshift(session);
  write(HISTORY_KEY, h.slice(0, 200));
}
function clearHistory() { write(HISTORY_KEY, []); }

// ===== speech.js =====
// Reconnaissance vocale (Web Speech API, gérée par Safari iOS) et synthèse vocale.

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const sttSupported = !!SR;
const ttsSupported = 'speechSynthesis' in window;

const LANG_CODES = { fr: 'fr-FR', en: 'en-GB' };

// ── Reconnaissance ────────────────────────────────────────────────
let rec = null;
let finalText = '';

function startListening(lang, { onText, onEnd, onError }) {
  if (!SR) { onError?.('unsupported'); return; }
  stopSpeaking();
  rec = new SR();
  rec.lang = LANG_CODES[lang];
  rec.continuous = true;
  rec.interimResults = true;
  rec.maxAlternatives = 1;
  finalText = '';
  rec.onresult = (e) => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const r = e.results[i];
      if (r.isFinal) finalText += r[0].transcript + ' ';
      else interim += r[0].transcript;
    }
    onText?.((finalText + interim).replace(/\s+/g, ' ').trim());
  };
  rec.onerror = (e) => onError?.(e.error);
  rec.onend = () => { onEnd?.(finalText.trim()); rec = null; };
  try { rec.start(); } catch (err) { onError?.(String(err)); }
}

function stopListening() {
  if (rec) { try { rec.stop(); } catch (_) { /* déjà arrêté */ } }
}

// ── Synthèse ──────────────────────────────────────────────────────
let voicesCache = [];
function loadVoices() { voicesCache = ttsSupported ? speechSynthesis.getVoices() : []; }
if (ttsSupported) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }

function voicesFor(lang) {
  if (!voicesCache.length) loadVoices();
  const prefix = lang === 'fr' ? 'fr' : 'en';
  return voicesCache.filter((v) => v.lang.toLowerCase().startsWith(prefix));
}

function chooseVoice(lang, wanted) {
  const list = voicesFor(lang);
  if (wanted) { const w = list.find((v) => v.voiceURI === wanted); if (w) return w; }
  const code = LANG_CODES[lang].toLowerCase();
  return list.find((v) => v.lang.toLowerCase().replace('_', '-') === code) || list[0] || null;
}

// iOS n'autorise la synthèse qu'après un geste utilisateur : on « débloque » au premier tap.
let unlocked = false;
function unlockAudio() {
  if (unlocked) return;
  unlocked = true;
  if (ttsSupported) { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); }
  getAudioCtx();
}

function speak(text, lang, opts = {}) {
  return new Promise((resolve) => {
    if (!ttsSupported || opts.muted) { resolve(); return; }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = LANG_CODES[lang];
    const voice = chooseVoice(lang, opts.voice);
    if (voice) u.voice = voice;
    u.rate = opts.rate || 1;
    u.pitch = opts.pitch || 1;
    let done = false;
    const finish = () => { if (!done) { done = true; resolve(); } };
    u.onend = finish;
    u.onerror = finish;
    speechSynthesis.speak(u);
    // Garde-fou : certains navigateurs ne déclenchent pas onend
    setTimeout(finish, Math.max(4000, text.length * 120));
  });
}

function stopSpeaking() { if (ttsSupported) speechSynthesis.cancel(); }

// ── Bruit de squelch (alternat) ───────────────────────────────────
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) audioCtx = new AC();
  }
  if (audioCtx?.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function squelch(duration = 0.12, volume = 0.08) {
  const ctx = getAudioCtx();
  if (!ctx) return Promise.resolve();
  const len = Math.floor(ctx.sampleRate * duration);
  const buf = ctx.createBuffer(1, len, ctx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = ctx.createBufferSource();
  src.buffer = buf;
  const filter = ctx.createBiquadFilter();
  filter.type = 'bandpass'; filter.frequency.value = 1800; filter.Q.value = 0.8;
  const gain = ctx.createGain();
  gain.gain.value = volume;
  src.connect(filter).connect(gain).connect(ctx.destination);
  src.start();
  return new Promise((r) => setTimeout(r, duration * 1000 + 60));
}

// ── Détection du moteur Claude ────────────────────────────────────
let samplePromise = null;
let sampleBlocked = false; // refus de consentement ou indisponibilité pendant cette visite

function getSample() {
  if (sampleBlocked) return Promise.resolve(null);
  if (!samplePromise) {
    samplePromise = window.claude?.use
      ? window.claude.use('sample').catch(() => null)
      : Promise.resolve(null);
  }
  return samplePromise;
}

async function engineName(settings) {
  if (settings.engine === 'local') return 'local';
  return (await getSample()) ? 'claude' : 'local';
}

const BLOCKING = ['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed', 'session_expired'];
const ERROR_COPY = {
  not_granted: 'Correction par Claude refusée pour cette visite.',
  rate_limited: 'Trop de demandes en même temps.',
  session_expired: 'Session claude.ai expirée, recharge la page.',
  invalid_json: 'Réponse de Claude illisible.',
  upstream_error: 'Claude est momentanément indisponible.',
};

async function askClaude(prompt, tier) {
  const sample = await getSample();
  if (!sample) throw Object.assign(new Error('Claude indisponible'), { code: 'unavailable' });
  try {
    return await sample.json(prompt, { modelTier: tier });
  } catch (e) {
    if (BLOCKING.includes(e?.code)) sampleBlocked = true;
    throw Object.assign(new Error(ERROR_COPY[e?.code] || 'Correction par Claude impossible.'), { code: e?.code });
  }
}

const RULES = `RÉFÉRENCE : Manuel de phraséologie à l'usage de la circulation aérienne générale, DSNA, 10e édition (15 avril 2023), conforme SERA. Règles principales :
1. Premier appel : indicatif COMPLET. L'indicatif abrégé (premier caractère + deux derniers, ex. F-GKAJ → F-AJ) n'est utilisable qu'après que la station l'a employé elle-même.
2. Collationnement : le pilote répète piste, QNH, fréquence, code transpondeur, cap, niveau/altitude, conditions des clairances conditionnelles, instructions de circuit, et termine par son indicatif. « Roger » ne remplace JAMAIS un collationnement ni une réponse affirme/négatif.
3. Le pilote collationne les clairances de décollage et d'atterrissage par « je décolle »/« taking off » et « j'atterris »/« landing ». « Autorisé » est réservé au contrôleur.
4. AFIS : l'agent AFIS ne délivre AUCUNE clairance. Le pilote annonce ses intentions (« je m'aligne et je décolle », « j'atterris »), ne demande pas d'autorisation ; l'AFIS informe (« piste libre », trafic, vent, QNH).
5. Expressions conventionnelles (SERA.14045) : affirme/affirm, négatif/negative, répétez/say again, wilco, roger, standby, correction, je répète/I say again, rappelez/report. « Over » et « out » ne s'emploient normalement pas en VHF. Pas de « oui », « non », « OK », « pardon ».
6. La piste est toujours désignée par « piste »/« runway » suivi de son identification. Fréquences avec « décimale »/« decimal ».
7. Au premier contact, annoncer l'information ATIS reçue.
8. Message d'arrivée/transit VFR : indicatif, type, VFR de… à…, intention, position, altitude, estimée, information ATIS.
9. Détresse : « MAYDAY » x3, organisme, indicatif, nature, intentions, position, niveau, cap. Urgence : « PAN PAN » x3, même structure.
10. Messages brefs ; langage clair seulement si la phraséologie normalisée ne convient pas.
11. En anglais : nombres chiffre par chiffre pour piste, cap, vent, QNH (sauf milliers ronds), transpondeur.
12. Auto-information (pratique usuelle, hors manuel) : nom du terrain en début ET en fin de message, indicatif complet, position, intentions.
13. Circuit : vent arrière, base, finale, « main gauche/droite », « pour un toucher », « atterrissage complet », « je remets les gaz »/« going around ».
TOLÉRANCE : le texte vient d'une reconnaissance vocale. Ignore ponctuation, majuscules, chiffres en lettres ou en chiffres, « juliette »/« juliett », « m'aider » pour « mayday », homophones évidents. En cas de doute, sévérité « conseil » avec la mention « possiblement dû à la reconnaissance vocale ».
VARIANTES : la réponse modèle est indicative ; une formulation différente mais conforme est correcte. N'invente pas de règle ; une remarque qui relève de l'usage plutôt que du manuel porte la source « usage ».`;

    situation: ex.situation,
    indicatif_complet: ex.cs,
    indicatif_abrege: ex.csA,
    indicatif_abrege_autorise: ex.abbr,
    elements_obligatoires: ex.rb.map((k) => ({ element: RB_LABELS[k], valeur: k === 'atis' ? `${ex.rbValues[k]} (${PHON[ex.rbValues[k]]})` : ex.rbValues[k] })),
    reponse_modele: ex.model,
    origine_modele: ex.src === 'usage' ? 'pratique usuelle hors manuel' : 'manuel DSNA',
    transmission_eleve: ex.transcript,
  };
}

// Évalue une transmission. Repli automatique sur les règles locales.
async function evaluateStep(settings, ex) {
  if ((await engineName(settings)) === 'claude') {
    try {
      const prompt = `${INTRO}\n${RULES}\n\nÉvalue cette transmission :\n${JSON.stringify(describeStep(ex), null, 1)}\n\nRéponds uniquement par un objet JSON de cette forme :\n${STEP_SCHEMA}`;
      const ev = await askClaude(prompt, 'quick');
      if (ev && typeof ev === 'object' && 'verdict' in ev) return { ...ev, engine: 'claude' };
      throw new Error('Réponse de Claude incomplète.');
    } catch (e) {
      const ev = localCheck(ex);
      ev.commentaire = `${e.message} Correction locale utilisée. ${ev.commentaire}`;
      return ev;
    }
  }
  return localCheck(ex);
}

// Débrief du mode expérimenté : un seul appel pour tout le scénario
async function evaluateSession(settings, exchanges, meta) {
  if ((await engineName(settings)) === 'claude' && exchanges.length) {
    try {
      const prompt = `${INTRO}\n${RULES}\n\nDébrief d'un scénario complet « ${meta.title} » (${meta.ad}, ${meta.lang === 'fr' ? 'français' : 'anglais'}). Évalue chaque transmission puis fais une synthèse. Transmissions :\n${JSON.stringify(exchanges.map(describeStep), null, 1)}\n\nRéponds uniquement par un objet JSON :\n{"note_globale": <0-10>, "synthese": "<3 phrases max>", "points_forts": ["..."], "axes_de_progres": ["..."], "etapes": [<un objet par transmission, dans l'ordre, au format ${STEP_SCHEMA}>]}`;
      const d = await askClaude(prompt, 'default');
      if (d && Array.isArray(d.etapes)) {
        d.etapes = d.etapes.map((e) => ({ ...e, engine: 'claude' }));
        return d;
      }
      throw new Error('Réponse de Claude incomplète.');
    } catch (e) {
      return localDebrief(exchanges, `${e.message} Correction locale utilisée.`);
    }
  }
  return localDebrief(exchanges);
}

function localDebrief(exchanges, note) {
  const etapes = exchanges.map(localCheck);
  const avg = etapes.length ? Math.round(etapes.reduce((t, e) => t + e.note, 0) / etapes.length * 10) / 10 : null;
  const cats = {};
  etapes.forEach((e) => e.erreurs.forEach((x) => { if (x.severite !== 'conseil') cats[x.categorie] = (cats[x.categorie] || 0) + 1; }));
  const top = Object.entries(cats).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([c, n]) => `${c} (${n})`);
  return {
    local: true,
    note_globale: avg,
    synthese: `${note ? `${note} ` : ''}${top.length ? `Points à travailler : ${top.join(', ')}.` : 'Aucune erreur détectée par les règles locales.'}`,
    points_forts: [], axes_de_progres: [], etapes,
  };
}

// ── Moteur de règles local ────────────────────────────────────────
const LETTER_RX = {
  A: 'alfa|alpha', B: 'bravo', C: 'charlie', D: 'delta', E: 'echo', F: 'fox', G: 'golf', H: 'hotel', I: 'india',
  J: 'juliet', K: 'kilo', L: 'lima', M: 'mike|maik', N: 'november|novembre', O: 'oscar', P: 'papa', Q: 'quebec|kebec',
  R: 'romeo', S: 'sierra', T: 'tango', U: 'uniform', V: 'victor', W: 'whisk', X: 'x ?ray|xray|ix ?re', Y: 'yankee|yanki', Z: 'zulu|zoulou',
};
const WORD_DIGITS = {
  zero: 0, un: 1, une: 1, one: 1, deux: 2, two: 2, trois: 3, three: 3, tree: 3, quatre: 4, four: 4,
  cinq: 5, five: 5, fife: 5, six: 6, sept: 7, seven: 7, huit: 8, eight: 8, neuf: 9, nine: 9, niner: 9,
};

const strip = (s) => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '');

function normalize(t) {
  let s = ` ${strip(t.toLowerCase())} `.replace(/[.,;:!?'’"«»()-]/g, ' ');
  s = s.replace(/\b[a-z]+\b/g, (w) => (w in WORD_DIGITS ? String(WORD_DIGITS[w]) : w));
  s = s.replace(/(\d)\s+(?=\d)/g, '$1');
  return s.replace(/\s+/g, ' ');
}

// Positions (index de mot) des lettres phonétiques reconnues, dans l'ordre du texte
function letterHits(norm) {
  const words = norm.trim().split(' ');
  const hits = [];
  for (let i = 0; i < words.length; i++) {
    const w = words[i] + (words[i + 1] ? ` ${words[i + 1]}` : '');
    for (const [L, rx] of Object.entries(LETTER_RX)) {
      if (new RegExp(`^(${rx})`).test(w)) { hits.push({ L, i }); break; }
    }
  }
  return { hits, count: words.length };
}

// Cherche une suite de lettres (sous-séquence ordonnée et compacte) ; renvoie l'index du dernier mot ou -1
function findSeq(hits, letters) {
  for (let s = 0; s < hits.length; s++) {
    if (hits[s].L !== letters[0]) continue;
    let k = 1, last = hits[s].i, j = s + 1;
    while (k < letters.length && j < hits.length) {
      if (hits[j].i - last > 2) break;
      if (hits[j].L === letters[k]) { k++; last = hits[j].i; }
      j++;
    }
    if (k === letters.length) return last;
  }
  return -1;
}
function findSeqLast(hits, letters) {
  let res = -1;
  for (let s = 0; s < hits.length; s++) {
    const r = findSeq(hits.slice(s), letters);
    if (r > res) res = r;
  }
  return res;
}

const has = (norm, rx) => new RegExp(rx).test(norm);

// Éléments attendus par étape (champ « need » des scénarios)
const NEED = {
  type: { label: "Type d'avion", test: (n, ex) => has(n, strip(ex.acType || 'dr400').toLowerCase().replace(/[^a-z0-9]/g, '').split('').join(' ?')) || has(n, '(robin|cessna|piper|tecnam|aquila|dr ?4|pa ?28|c ?1[57]2)') },
  vfr: { label: 'VFR', test: (n) => has(n, 'v ?f ?r') },
  pos: { label: 'Position', test: (n) => has(n, '\\b(nm|nautique|mile|nord|sud|est|ouest|north|south|east|west)') },
  alt: { label: 'Altitude', test: (n) => has(n, '(pied|feet|ft)\\b') },
  eta: { label: 'Heure estimée', test: (n) => has(n, 'estim') },
  hdg: { label: 'Cap', test: (n) => has(n, '\\b(cap|heading)\\b') },
  pob: { label: 'Personnes à bord', test: (n) => has(n, '(personne|a bord|persons|on board|pob)') },
  from: { label: 'Provenance', test: (n, ex) => has(n, strip(ex.fromName).toLowerCase().split(' ')[0]) },
  to: { label: 'Destination', test: (n, ex) => has(n, strip(ex.toName).toLowerCase().split(' ')[0]) },
  landing: { label: 'Atterrissage', test: (n) => has(n, '(atterri|landing|full stop|atterrissage complet)') },
  takeoff: { label: 'Décollage', test: (n) => has(n, '(decoll|taking off|take off)') },
  lineup: { label: 'Alignement', test: (n) => has(n, '(align|lining up|line up)') },
  taxi: { label: 'Demande de roulage', test: (n) => has(n, '(roul|taxi)') },
  goaround: { label: 'Remise de gaz', test: (n) => has(n, '(remet|remise|going around|go around)') },
  touch: { label: 'Toucher', test: (n) => has(n, '(toucher|touch)') },
  downwind: { label: 'Vent arrière', test: (n) => has(n, '(vent arriere|downwind)') },
  final: { label: 'Finale', test: (n) => has(n, 'final') },
  vacated: { label: 'Piste dégagée', test: (n) => has(n, '(degag|vacat)') },
  leaving: { label: 'Quitte la fréquence / le circuit', test: (n) => has(n, '(quitt|leaving)') },
  ready: { label: 'Prêt au départ', test: (n) => has(n, '(pret|ready)') },
  holding: { label: "Point d'arrêt", test: (n) => has(n, '(point d ?arret|holding)') },
  overhead: { label: 'Verticale', test: (n) => has(n, '(verticale|overhead)') },
  transit: { label: 'Transit', test: (n) => has(n, 'transit') },
  insight: { label: 'Trafic en vue', test: (n) => has(n, '(en vue|in sight)') },
  number: { label: 'Numéro dans la séquence', test: (n) => has(n, '(numero|number) ?2') },
  report: { label: 'Accusé de réception (je rappelle / wilco)', test: (n) => has(n, '(rappel|wilco|report)') },
  circuits: { label: 'Tours de piste', test: (n) => has(n, '(tours? de piste|circuit)') },
  nature: { label: 'Nature du problème', test: (n) => has(n, '(moteur|engine|panne|failure|rough)') },
  intent: { label: 'Intentions', test: (n) => has(n, '(deroute|divert|atterri|landing|campagne|field|force)') },
  ground: { label: 'Posé', test: (n) => has(n, '(pose|on ground|au sol|landed)') },
  injuries: { label: 'Blessés', test: (n) => has(n, '(bless|injur)') },
};

const TERMS = [
  { rx: '\\b(ok|okay|d accord|dac)\\b', sev: 'mineure', cat: 'terminologie', said: 'OK / d\'accord', fr: 'roger / wilco', en: 'roger / wilco', why: '« OK » n\'est pas une expression conventionnelle (SERA.14045).' },
  { rx: '^ ?(oui|yes|yeah)\\b|\\b(oui|yes)\\b', sev: 'mineure', cat: 'terminologie', said: 'oui / yes', fr: 'affirme', en: 'affirm', why: 'Répondre « affirme » / « affirm », pas « oui ».' },
  { rx: '^ ?(non|no)\\b', sev: 'mineure', cat: 'terminologie', said: 'non / no', fr: 'négatif', en: 'negative', why: 'Répondre « négatif » / « negative », pas « non ».' },
  { rx: '\\b(pardon|quoi|what)\\b', sev: 'mineure', cat: 'terminologie', said: 'pardon', fr: 'répétez', en: 'say again', why: 'Pour faire répéter : « répétez » / « say again ».' },
  { rx: '\\b(over|out|termine)\\s*$', sev: 'mineure', cat: 'superflu', said: 'over / out', fr: '(rien)', en: '(nothing)', why: '« Over » et « out » ne s\'emploient normalement pas en VHF.' },
  { rx: '\\b(merci|thank you|thanks)\\b', sev: 'conseil', cat: 'superflu', said: 'merci', fr: '(à supprimer)', en: '(remove)', why: 'Formule de politesse superflue en dehors du premier et du dernier contact.' },
  { rx: '\\b(euh|heu|hum|uh|um)\\b', sev: 'conseil', cat: 'superflu', said: 'euh', fr: '(à supprimer)', en: '(remove)', why: 'Prépare ton message avant d\'appuyer sur l\'alternat.' },
];

function localCheck(ex) {
  const norm = normalize(ex.transcript);
  const { hits, count } = letterHits(norm);
  const erreurs = [];
  const coll = [];
  const add = (severite, categorie, entendu, correction, explication, source = 'manuel') =>
    erreurs.push({ severite, categorie, entendu, correction, explication, source });

  // 1. Indicatif
  const full = ex.cs.replace(/[^A-Z0-9]/gi, '').toUpperCase().split('');
  const abbrL = [full[0], ...full.slice(-2)];
  const fullEnd = findSeqLast(hits, full);
  const abbrEnd = findSeqLast(hits, abbrL);
  const csEnd = Math.max(fullEnd, abbrEnd);
  const csSpoken = full.map((l) => PHON[l]).join(' ');
  const abbrSpoken = abbrL.map((l) => PHON[l]).join(' ');
  if (csEnd < 0) {
    add('majeure', 'indicatif', '—', ex.abbr ? `${ex.csA} (${abbrSpoken})` : `${ex.cs} (${csSpoken})`,
      'Indicatif absent ou erroné : il doit figurer dans chaque transmission, en alphabet phonétique.');
  } else if (!ex.abbr && fullEnd < 0) {
    add('majeure', 'indicatif', ex.csA, `${ex.cs} (${csSpoken})`,
      'Indicatif complet obligatoire tant que la station ne l\'a pas abrégé elle-même.');
  }
  if (ex.rb.includes('cs')) coll.push({ element: RB_LABELS.cs, attendu: ex.cs, entendu: fullEnd >= 0 ? ex.cs : (abbrEnd >= 0 ? ex.csA : 'absent'), ok: fullEnd >= 0 });
  // Indicatif en fin de collationnement
  const endsWithCs = /\{csA?\}\.?\s*$/.test(ex.modelTpl || '') || ex.model.trim().replace(/\.$/, '').endsWith(ex.abbr ? ex.csA : ex.cs);
  const isReadback = ex.rb.some((k) => ['qnh', 'rwy', 'side', 'freq'].includes(k));
  if (csEnd >= 0 && endsWithCs && count - 1 - csEnd > 2) {
    add(isReadback ? 'mineure' : 'conseil', 'ordre', '…', 'indicatif en fin de message', 'Dans un collationnement ou une réponse, l\'indicatif se place à la fin.');
  }

  // 2. Nom de la station en début de message (appel)
  if (ex.stationFirst && ex.stationName) {
    const st = strip(ex.stationName.toLowerCase()).split(' ')[0];
    const firstWords = norm.trim().split(' ').slice(0, 3).join(' ');
    if (!firstWords.includes(st)) {
      const wrong = norm.match(/^\s*(?:mayday \S+ \S+ |pan pan pan pan pan pan )?([a-z]+(?: [a-z]+)?) (information|info|tour|tower|traffic)\b/);
      if (wrong) add('majeure', 'autre', `${wrong[1]} ${wrong[2]}`, ex.stationName, 'Mauvaise station appelée : vérifie le nom de l\'organisme avant d\'émettre.');
      else add('mineure', 'ordre', '—', ex.stationName, 'Un appel commence par le nom de la station appelée.');
    }
  }
  if (ex.kind === 'auto' && ex.stationName) {
    const st = strip(ex.stationName.toLowerCase()).split(' ')[0];
    const lastWords = norm.trim().split(' ').slice(-3).join(' ');
    if (!lastWords.includes(st)) add('mineure', 'ordre', '—', `… ${ex.stationName}`, 'En auto-information, le message se termine par le nom du terrain.', 'usage');
  }

  // 3. Collationnement des valeurs
  const nums = (norm.match(/\d+/g) || []);
  for (const k of ex.rb) {
    if (k === 'cs') continue;
    const val = String(ex.rbValues[k]);
    let ok = false, said = 'absent';
    if (k === 'qnh') {
      ok = nums.includes(val);
      const other = nums.find((n) => /^(9[5-9]\d|10[0-4]\d)$/.test(n) && n !== val);
      if (!ok && other) said = other;
    } else if (k === 'rwy') {
      const m = norm.match(/(piste|runway)\s*(\d{1,2})/);
      ok = nums.some((n) => n === val || n === String(+val));
      if (m && +m[2] !== +val) { ok = false; said = m[2]; }
    } else if (k === 'side') {
      const left = /gauche|left/.test(val);
      ok = left ? /gauche|left/.test(norm) : /droite|right/.test(norm);
      if (!ok && (left ? /droite|right/.test(norm) : /gauche|left/.test(norm))) said = left ? 'droite' : 'gauche';
    } else if (k === 'atis') {
      const m = norm.match(/information\s+([a-z]+(?: [a-z]+)?)/);
      ok = new RegExp(`information (${LETTER_RX[val]}|${val.toLowerCase()}\\b)`).test(norm);
      if (!ok && m) said = m[1];
    } else if (k === 'freq') {
      ok = norm.replace(/\s/g, '').includes(val.replace(/\D/g, '').replace(/0+$/, ''));
    }
    coll.push({ element: RB_LABELS[k], attendu: k === 'atis' ? `${val} (${PHON[val]})` : val, entendu: ok ? val : said, ok });
    if (!ok) {
      add('majeure', 'collationnement', said, k === 'atis' ? `information ${PHON[val]}` : `${RB_LABELS[k]} ${val}`,
        said === 'absent'
          ? (k === 'atis' ? 'Annonce l\'information ATIS reçue dès le premier contact.' : `Élément « ${RB_LABELS[k]} » à collationner.`)
          : `Valeur erronée : « ${said} » au lieu de « ${val} ».`);
    }
  }

  // 4. « Roger » à la place d'un collationnement
  const needsReadback = ex.rb.some((k) => ['qnh', 'rwy', 'side', 'freq'].includes(k));
  if (needsReadback && /\broger\b/.test(norm) && coll.some((c) => !c.ok)) {
    add('majeure', 'collationnement', 'roger', 'collationnement complet', '« Roger » ne remplace jamais un collationnement.');
  }

  // 5. Clairances et service
  if (/\b(autoris|clearance|cleared|clear for)/.test(norm)) {
    if (ex.kind === 'afis' || ex.kind === 'auto') {
      add('majeure', 'terminologie', 'autorisation / clearance', 'annonce d\'intention (je m\'aligne et je décolle, j\'atterris)',
        ex.kind === 'afis' ? 'Un AFIS ne délivre aucune clairance : le pilote annonce ses intentions.' : 'En auto-information, personne ne délivre de clairance.');
    } else {
      add('majeure', 'terminologie', 'autorisé', ex.lang === 'fr' ? 'j\'atterris / je décolle' : 'landing / taking off',
        '« Autorisé » est réservé au contrôleur ; le pilote collationne par « j\'atterris » / « je décolle ».');
    }
  }

  // 6. Éléments de contenu attendus
  for (const key of ex.need || []) {
    const n = NEED[key];
    if (n && !n.test(norm, ex)) add(['nature', 'intent'].includes(key) ? 'majeure' : 'mineure', 'omission', 'absent', n.label, `Élément attendu dans ce message : ${n.label.toLowerCase()}.`);
  }

  // 7. Messages de détresse et d'urgence
  if (ex.urgency) {
    const word = ex.urgency === 'mayday' ? '(mayday|m aider|mai de)' : '(pan)';
    const c = (norm.match(new RegExp(word, 'g')) || []).length;
    const expected = ex.urgency === 'mayday' ? 3 : 6;
    if (c === 0) add('majeure', 'omission', 'absent', ex.urgency === 'mayday' ? 'MAYDAY MAYDAY MAYDAY' : 'PAN PAN, PAN PAN, PAN PAN', 'Le message doit commencer par le signal de détresse ou d\'urgence.');
    else if (c < expected) add('mineure', 'ordre', `${c}×`, ex.urgency === 'mayday' ? 'MAYDAY ×3' : 'PAN PAN ×3', 'Le signal se prononce de préférence trois fois (SERA.14095).');
  }

  // 8. Termes non conventionnels
  for (const t of TERMS) {
    if (new RegExp(t.rx).test(norm)) add(t.sev, t.cat, t.said, ex.lang === 'fr' ? t.fr : t.en, t.why);
  }
  // En anglais : piste/runway
  if (ex.lang === 'en' && ex.rb.includes('rwy') && /\bpiste\b/.test(norm)) add('majeure', 'terminologie', 'piste', 'runway', 'Exercice en anglais : « runway ».');
  if (ex.lang === 'fr' && ex.rb.includes('rwy') && /\brunway\b/.test(norm)) add('majeure', 'terminologie', 'runway', 'piste', 'Exercice en français : « piste ».');

  const majors = erreurs.filter((e) => e.severite === 'majeure').length;
  const minors = erreurs.filter((e) => e.severite === 'mineure').length;
  const note = Math.max(0, 10 - majors * 3 - minors);
  return {
    local: true, engine: 'local',
    note,
    verdict: majors ? 'incorrect' : minors ? 'acceptable' : 'correct',
    collationnement: coll,
    erreurs,
    version_corrigee: ex.model,
    commentaire: majors || minors ? '' : 'Rien à signaler par les règles locales.',
  };
}
